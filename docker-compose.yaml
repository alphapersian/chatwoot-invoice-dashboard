# Used by Coolify (and local `docker compose up`).
# Do NOT map host ports here — Coolify routes traffic to container port 80 via its proxy.
# For local access on http://localhost:8080, use: docker compose -f docker-compose.local.yaml up --build

services:
  app:
    build: .
    expose:
      - "80"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/health.php"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
