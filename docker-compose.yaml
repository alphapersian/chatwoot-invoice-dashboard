# Local smoke test: docker compose up --build
# Coolify deploys from the Dockerfile directly (port 80, no compose required).

services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/health.php"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
