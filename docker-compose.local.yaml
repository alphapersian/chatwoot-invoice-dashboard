# Local dev only — publishes the app on http://localhost:8080
# Usage: docker compose -f docker-compose.local.yaml up --build

services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/health.php"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
